name: FileCompare
options:
  bundleIdPrefix: io.github.malenitaa
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  FileCompare:
    type: application
    platform: macOS
    sources:
      - path: FileCompare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.malenitaa.FileCompare
        PRODUCT_NAME: FileCompare
        INFOPLIST_KEY_CFBundleDisplayName: FileCompare
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_PREVIEWS: YES

  FileCompareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FileCompareTests
    dependencies:
      - target: FileCompare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.malenitaa.FileCompareTests

schemes:
  FileCompare:
    build:
      targets:
        FileCompare: all
        FileCompareTests: [test]
    test:
      targets:
        - FileCompareTests
    run:
      config: Debug
